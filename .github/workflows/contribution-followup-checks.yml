name: Contribution follow-up checks
on:
  push:
    branches: [validation/orca-review-followups-20261126]
permissions:
  contents: read
concurrency:
  group: contribution-followups-20261126
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  changed-checks:
    name: PR ${{ matrix.pr }} changed checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: 49721
            sha: dc112e9a702e241aea7c39f3237cefd6c5698703
          - pr: 49753
            sha: 932cbb93d5f1d6f8edf244e1972a01cbac0891f8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          filter: blob:none
          fetch-depth: 50
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-pnpm-store: 'false'
          persist-native-cache: 'false'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Check the complete contribution
        run: timeout 900 pnpm check:changed --base=3e227259249d2daa02ce89f927036bb931fcd1b1
