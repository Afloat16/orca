name: Contribution follow-up checks
on:
  push:
    branches: [validation/orca-review-followups-20261126]
permissions:
  contents: read
concurrency:
  group: contribution-followups-20261126
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  changed-checks:
    name: PR ${{ matrix.pr }} changed checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: 49727
            sha: 7508091724fc699ac245a0c67c9362f42679e2f2
          - pr: 49728
            sha: a54f1e62beba431be0a8b11ad848ae4f9b155316
          - pr: 49733
            sha: 20cf1e3cf72a46f75b074cefbb77e60a409eeb76
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          filter: blob:none
          fetch-depth: 50
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-pnpm-store: 'false'
          persist-native-cache: 'false'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Check the complete contribution
        run: timeout 900 pnpm check:changed --base=3e227259249d2daa02ce89f927036bb931fcd1b1
