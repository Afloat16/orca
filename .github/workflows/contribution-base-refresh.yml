name: Contribution base refresh checks
on:
  push:
    branches: [validation/orca-ci-refresh-20261127]
permissions:
  contents: read
concurrency:
  group: contribution-base-refresh-20261127
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  changed-checks:
    name: PR ${{ matrix.pr }} integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: 49731
            sha: ff9664ce689feb08d1bf66c30a3049d5af743611
          - pr: 49737
            sha: 6759135d3fc97e70553449837b84669338a62518
          - pr: 49728
            sha: 1d6223e8ca93dcfea69420e00dcb403e44c4314e
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          filter: blob:none
          fetch-depth: 50
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-pnpm-store: 'false'
          persist-native-cache: 'false'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Check the complete contribution
        run: timeout 900 pnpm check:changed --base=d9348ff5290fb7dd3f92f16d09b62119c24953be --maxWorkers=2
      - name: Verify the orcad terminal smoke
        run: timeout 420 pnpm smoke:orcad-terminal
      - name: Confirm validation did not modify tracked sources
        run: git diff --exit-code
