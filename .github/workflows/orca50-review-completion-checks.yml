name: Orca contribution review checks
on:
  push:
    branches: [validation/orca50-review-completion-20261127]
permissions:
  contents: read
concurrency:
  group: orca50-review-completion-20261127
  cancel-in-progress: false
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  changed-checks:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slug: opencode-main-compatible-review-fixes
            sha: 981975040d7d71e231eb3c31965f9f0d5d9eb18f
            base: 6a8e7f533cf9f6e40afbc090ac35f42efb2e9b79
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          filter: blob:none
          fetch-depth: 50
          persist-credentials: false
      - name: Verify exact candidate and base
        env:
          CANDIDATE_SHA: ${{ matrix.sha }}
          CANDIDATE_BASE: ${{ matrix.base }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$CANDIDATE_BASE^{commit}"
          git diff --exit-code
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-pnpm-store: 'false'
          persist-native-cache: 'false'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Reproduce the invisible-preview regression on exact parent sources
        env:
          CANDIDATE_SHA: ${{ matrix.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          
          candidate = os.environ["CANDIDATE_SHA"]
          baseline = "d9a05c3882c493d04fbc521c6f4031b85f2babcb"
          test_path = "src/main/ai-vault/scanners/opencode/session-scanner-opencode-json-parts.test.ts"
          test_name = "keeps earlier visible previews when newer part messages normalize to no preview"
          report = Path(os.environ["RUNNER_TEMP"]) / "opencode-preview-baseline.json"
          report.unlink(missing_ok=True)
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          
          assert git("rev-parse", "HEAD") == candidate
          assert not git("diff", "--name-only")
          fixture = subprocess.check_output(["git", "show", candidate + ":" + test_path])
          subprocess.run(["git", "checkout", "--quiet", "--detach", baseline], check=True)
          try:
              assert git("rev-parse", "HEAD") == baseline
              Path(test_path).write_bytes(fixture)
              assert set(git("diff", "--name-only").splitlines()) == {test_path}
              command = [
                  "node", "config/scripts/test-runtime/execution-policy/run-vitest.mjs",
                  "run", "--config", "config/vitest.config.ts", test_path,
                  "--maxWorkers=1", "--testNamePattern=" + test_name,
                  "--reporter=json", "--outputFile=" + str(report),
              ]
              completed = subprocess.run(command, text=True, stdout=subprocess.PIPE,
                                         stderr=subprocess.STDOUT, timeout=180)
              print(completed.stdout[-16000:], flush=True)
              assert report.is_file(), "Missing structured test report."
              result = json.loads(report.read_text())
              assert result.get("numRuntimeErrorTestSuites", 0) == 0, "Runtime errors are invalid evidence."
              assert completed.returncode == 1, ("Expected a behavior assertion failure", completed.returncode)
              assertions = [a for suite in result.get("testResults", [])
                            for a in suite.get("assertionResults", [])]
              selected = [a for a in assertions if a.get("title", a.get("fullName")) == test_name]
              assert len(selected) == 1
              actual = selected[0]
              assert actual["status"] == "failed", actual
              failures = actual.get("failureMessages", [])
              assert failures and all("AssertionError" in failure for failure in failures), failures
              assert not [a for a in assertions if a["status"] == "failed" and a is not actual]
              assert set(git("diff", "--name-only").splitlines()) == {test_path}
              assert not git("diff", "--cached", "--name-only")
              assert git("rev-parse", "HEAD") == baseline
              print(json.dumps({"source": baseline, "name": test_name,
                                "status": actual["status"], "failureMessages": failures,
                                "productionFilesModified": False}), flush=True)
              print("EXPECTED PREVIEW REGRESSION REPRODUCED: one assertion failure on exact parent production sources.", flush=True)
          finally:
              subprocess.run(["git", "restore", "--worktree", "--", test_path], check=True)
              subprocess.run(["git", "checkout", "--quiet", "--detach", candidate], check=True)
              assert git("rev-parse", "HEAD") == candidate
              assert not git("diff", "--name-only")
              print("Restored exact candidate with tracked sources unchanged.", flush=True)
          PY
      - name: Verify all OpenCode review regressions and maintained controls
        run: |
          node config/scripts/test-runtime/execution-policy/run-vitest.mjs run --config config/vitest.config.ts \
            src/main/ai-vault/scanners/opencode/session-scanner-opencode-json-parts.test.ts \
            src/main/ai-vault/scanners/opencode/session-scanner-opencode-freshness.test.ts \
            src/main/ai-vault-search/indexing/session-search-opencode-json-read-errors.test.ts \
            src/main/ai-vault/transcripts/session-transcript-message-content.test.ts \
            --maxWorkers=2
      - name: Check the complete contribution
        run: timeout 900 pnpm check:changed --base=${{ matrix.base }} --maxWorkers=2
      - name: Confirm validation did not modify tracked sources
        if: always()
        run: git diff --exit-code
