name: Orca contribution review checks
on:
  push:
    branches: [validation/orca50-review-completion-20261127]
permissions:
  contents: read
concurrency:
  group: orca50-review-completion-20261127
  cancel-in-progress: false
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  changed-checks:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slug: opencode-json-message-parts
            sha: e6fa4c61b8b59656d8f1e41b15192fa9b5f8f7c6
            base: 9890ea181c0f9ae59fb82da64c4a6fbc0504a817
          - slug: gitlab-context-line-comments
            sha: b561366bf77411f6e7056eb2cac9b2b3bf6082c0
            base: 2194f552640e2afe07f9507f885251045c05c9e8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          filter: blob:none
          fetch-depth: 50
          persist-credentials: false
      - name: Verify exact candidate and base
        env:
          CANDIDATE_SHA: ${{ matrix.sha }}
          CANDIDATE_BASE: ${{ matrix.base }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$CANDIDATE_BASE^{commit}"
          git diff --exit-code
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-pnpm-store: 'false'
          persist-native-cache: 'false'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Check the complete contribution
        run: timeout 900 pnpm check:changed --base=${{ matrix.base }} --maxWorkers=2
      - name: Confirm validation did not modify tracked sources
        if: always()
        run: git diff --exit-code
