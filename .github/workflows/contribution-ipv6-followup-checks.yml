name: IPv6 remote follow-up checks
on:
  push:
    branches: [validation/orca49735-ipv6-20261127]
permissions:
  contents: read
concurrency:
  group: contribution-ipv6-20261127
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  changed-checks:
    name: PR ${{ matrix.pr }} changed checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: 49735
            sha: fc0b6206b28f8d5a65df952131c3b165cce2ac5b
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          filter: blob:none
          fetch-depth: 50
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-pnpm-store: 'false'
          persist-native-cache: 'false'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Check the complete contribution
        run: timeout 900 pnpm check:changed --base=3e227259249d2daa02ce89f927036bb931fcd1b1
