name: Remaining contribution checks
on:
  push:
    branches: [validation/orca-remaining-pr-checks-20261126]
permissions:
  contents: read
concurrency:
  group: remaining-contribution-checks-20261126
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  changed-checks:
    name: PR ${{ matrix.pr }} changed checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - pr: 49720
            sha: c445ba05405a94ce894b720269ae17df3b941ece
            base: 4e43dffdaca90950629735e77ccacb21f2513a1e
