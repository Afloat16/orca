            base: 3e227259249d2daa02ce89f927036bb931fcd1b1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          filter: blob:none
          fetch-depth: 50
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-pnpm-store: 'false'
          persist-native-cache: 'false'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Check the complete contribution
        env:
          CONTRIBUTION_BASE: ${{ matrix.base }}
        run: timeout 900 pnpm check:changed --base="$CONTRIBUTION_BASE"
