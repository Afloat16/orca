name: Orca contribution review checks
on:
  push:
    branches: [validation/orca50-review-followups-20261127]
permissions:
  contents: read
concurrency:
  group: orca50-review-followups-20261127
  cancel-in-progress: false
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  changed-checks:
    name: ${{ matrix.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slug: calendar-list-pagination
            sha: 0f61ee8d821ed7060e2d6eb1dd9f8b6f2e3ba491
            base: cbc710a6364f15124cdb667663537adfb788f7f0
          - slug: docs-comment-pagination
            sha: 19a4df72e9a5b6e0425a93f1c9aea04ada7340f5
            base: 19e47a17ae43e523712712a23add70b3dba2473b
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          filter: blob:none
          fetch-depth: 50
          persist-credentials: false
      - name: Verify exact candidate and base
        env:
          CANDIDATE_SHA: ${{ matrix.sha }}
          CANDIDATE_BASE: ${{ matrix.base }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$CANDIDATE_BASE^{commit}"
          git diff --exit-code
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-pnpm-store: 'false'
          persist-native-cache: 'false'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Check the complete contribution
        run: timeout 900 pnpm check:changed --base=${{ matrix.base }} --maxWorkers=2
      - name: Confirm validation did not modify tracked sources
        if: always()
        run: git diff --exit-code
